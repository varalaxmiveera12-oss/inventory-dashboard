<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Product Inventory &amp; Analytics Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <header>
      <h1>Interactive Product Inventory &amp; Analytics Dashboard</h1>
      <p class="sub">JavaScript Capstone Mini Project &mdash; console-style output shown below.</p>
    </header>

    <section class="controls">
      <button id="runPrompt" type="button">&#9654; Run with prompts</button>
      <button id="runDemo" type="button" class="secondary">Run with demo data (Monitor, $150)</button>
      <button id="clearBtn" type="button" class="ghost">Clear</button>
    </section>

    <section>
      <h2>Console Output</h2>
      <pre id="output" aria-live="polite">Click a button above to run the program.</pre>
      <p class="hint">Tip: press F12 and open the Console tab to see the same output there.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
